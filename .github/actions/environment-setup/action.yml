name: Environment setup
description: Set up the environment by installing java and gradle

runs:
  using: composite

  steps:
    - uses: actions/setup-java@v5
      with:
        java-version: 17
        java-package: jdk
        distribution: "temurin"
        # NOTE: deliberately no `cache: gradle` here. setup-gradle below caches the Gradle User Home - including
        # `caches/build-cache-1`, the local build cache - and its docs explicitly warn that setup-java's coarser
        # caching may interfere with it. Having both meant the two mechanisms wrote overlapping copies of
        # ~/.gradle/caches under different keys.
        #
        # The build cache matters a lot for the native job: Kotlin/Native compile *and* link tasks are cacheable,
        # so a populated cache turns most of that job into FROM-CACHE.

    - uses: gradle/actions/setup-gradle@v4
      with:
        # Only write to the cache for builds on the 'master' branch. (Default is 'main'.)
        # Builds on other branches will only read existing entries from the cache.
        # https://github.com/marketplace/actions/gradle-build-action#using-the-caches-read-only
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}
        
        # Clean-up unused entries to prevent stale cache entries to occupy storage
        # https://github.com/marketplace/actions/gradle-build-action#removing-unused-files-from-gradle-user-home-before-saving-to-cache
        gradle-home-cache-cleanup: true
