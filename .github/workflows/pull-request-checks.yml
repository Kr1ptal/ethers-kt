# For local testing use this: https://github.com/nektos/act

name: Run Pull Request Checks

on:
  push:
    branches:
      - master

  pull_request:
    types: [ opened, synchronize, reopened ] # default events - listed to make them explicit

# cancel any existing actions for current branch/PR on new push, unless the action is running on master
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  java-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/environment-setup

      # Every source set, native ones included: lint tasks depend on no compilation (see ktlint-conventions), so they
      # run on a host that cannot build the Apple targets.
      - name: Gradle ktlint
        run: ./gradlew ktlintCheck --no-watch-fs --stacktrace

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: report-lint
          path: |
            build/reports/ktlint
            */build/reports/ktlint

      # `jvmKotest` rather than `test`: the latter also runs the per-module `kotest` task, which aggregates every
      # target and so pulls in native compilation.
      - name: Gradle test
        run: ./gradlew jvmKotest :ethers-abigen-plugin:test --no-watch-fs --stacktrace -Dlog.level=debug

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: report-unit-test
          path: |
            */build/reports/tests
            */build/test-results

  native-test:
    name: native-test (apple targets)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/environment-setup

      # setup-gradle caches ~/.gradle but not ~/.konan, where the Kotlin/Native toolchain lives, so the job
      # otherwise re-downloads and unpacks the compiler bundle and LLVM every run.
      #
      # `dependencies/cache` holds the downloaded tarballs, which are only needed to extract the directories
      # beside them, so it is excluded to keep the entry near ~2GB against the 10GB per-repo budget.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Tests run on macOS only. All native code is in nativeMain, shared by every Apple target, so the iOS simulator
      # would run the same arm64 code on the same backend again. Pull requests only link the simulator test binary,
      # which still resolves every iOS dependency, and master runs the simulator tests too. The iOS device targets
      # compile their main code, which is what gets published; iosX64 could not run tests on an arm64 runner anyway.
      - name: Gradle test (Apple targets)
        run: >-
          ./gradlew
          macosArm64Test
          ${{ github.event_name == 'push' && 'iosSimulatorArm64Test' || 'linkDebugTestIosSimulatorArm64' }}
          compileKotlinIosArm64
          compileKotlinIosX64
          --no-watch-fs
          --stacktrace

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: report-native-test
          path: |
            */build/reports/tests
            */build/test-results
