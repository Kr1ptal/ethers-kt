# For local testing use this: https://github.com/nektos/act

name: Run Pull Request Checks

on:
  push:
    branches:
      - master

  pull_request:
    types: [ opened, synchronize, reopened ] # default events - listed to make them explicit

# cancel any existing actions for current branch/PR on new push, unless the action is running on master
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  java-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/environment-setup

      # Every task here is named per source set rather than using the `ktlintCheck` / `test` aggregates. Those
      # aggregates reach the Apple targets, and Kotlin/Native cannot cross-compile those from Linux, so they fail
      # on this runner. The native-test job below covers what is skipped here.
      - name: Gradle ktlint
        run: >-
          ./gradlew
          ktlintKotlinScriptCheck
          ktlintCommonMainSourceSetCheck
          ktlintCommonTestSourceSetCheck
          ktlintJvmMainSourceSetCheck
          ktlintJvmTestSourceSetCheck
          ktlintJvmSharedMainSourceSetCheck
          ktlintJvmSharedTestSourceSetCheck
          ktlintAndroidMainSourceSetCheck
          ktlintAndroidUnitTestSourceSetCheck
          --no-watch-fs
          --stacktrace

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: report-lint
          path: |
            build/reports/ktlint
            */build/reports/ktlint

      # `jvmKotest` rather than `test`: the latter also runs the per-module `kotest` task, which aggregates every
      # target and so pulls in native compilation.
      - name: Gradle test
        run: ./gradlew jvmKotest :ethers-abigen-plugin:test --no-watch-fs --stacktrace -Dlog.level=debug

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: report-unit-test
          path: |
            */build/reports/tests
            */build/test-results

  native-test:
    name: native-test (apple targets)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/environment-setup

      # setup-gradle caches ~/.gradle but not ~/.konan, where the Kotlin/Native toolchain lives, so the job
      # otherwise re-downloads and unpacks the compiler bundle and LLVM every run.
      #
      # `dependencies/cache` holds the downloaded tarballs, which are only needed to extract the directories
      # beside them, so it is excluded to keep the entry near ~2GB against the 10GB per-repo budget.
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.konan
            !~/.konan/dependencies/cache
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # The full aggregate, which the ubuntu job cannot run. It covers src/nativeMain and src/nativeTest, whose
      # source sets do not even exist on a host that cannot configure the Apple targets.
      - name: Gradle ktlint (all source sets)
        run: ./gradlew ktlintCheck --no-watch-fs --stacktrace

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: report-lint-native
          path: |
            build/reports/ktlint
            */build/reports/ktlint

      # Every Apple target, so nothing is published untested. Only two of the four can execute tests:
      #   - iosArm64 is a device target and has no test task at all
      #   - iosX64Test is SKIPPED on an arm64 runner, since an x64 simulator binary cannot execute there. It is
      #     silently skipped rather than failed, so it is compile-checked instead - a green `iosX64Test` would
      #     mean nothing.
      - name: Gradle test (Apple targets)
        run: >-
          ./gradlew
          macosArm64Test
          iosSimulatorArm64Test
          compileTestKotlinIosArm64
          compileTestKotlinIosX64
          --no-watch-fs
          --stacktrace

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: report-native-test
          path: |
            */build/reports/tests
            */build/test-results
